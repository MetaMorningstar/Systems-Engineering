; =============================================================================
;  WORD REPORT STYLE  -  how <name>_verification.docx looks
; =============================================================================
;  Open this file with Notepad, change a value, save it, and run the tool
;  again. A document that was already read takes only seconds the second
;  time: the slow reading of the scan is kept in the _cache folder.
;
;  HOW THE VALUES WORK
;   * Leave a value EMPTY to keep the normal look:
;       - with your own Word template (see [document]): the template's look,
;       - without one: the tool's own look, shown in (brackets).
;     So fill in only what you want to change.
;   * A value you fill in always wins - also over your template.
;   * Anything after a semicolon ( ; ) is a comment (in a template file name,
;     put a space before the semicolon).
;   * Font sizes and spacing are in points, as in Word:      10.5
;     Indents and margins need a unit (cm, mm or in):         2 cm   0.5 in
;   * Colours: the 6-character code from Word's Font Color > More Colors >
;     Custom (Hex), e.g. 1F4E9A, or one of: black, gray, red, dark red, blue,
;     dark blue, green, orange, purple, automatic (Word's normal black).
;   * Switches: yes or no.
;   * A mistake (a misspelt name, a size of "ten") stops the run BEFORE any
;     document is read, with a message giving the line and what to write.
;   * To start again, delete the value (or this whole file: the tool's own
;     look is then used).
;   * Easiest of all: double-click make_word_template.bat. It makes a Word
;     file with every style of the report and a sample of each, which you
;     can restyle in Word itself and then name as the template below.
; =============================================================================

[document]
; Your organisation's Word template (.dotx) or a Word document (.docx) whose
; look the report should copy: its styles and fonts, page size and margins,
; and its page headers and footers (logo, classification marking). None of
; its text is copied, and nothing in it that points to another file or to a
; network location is ever used. Put the file in this word_style folder and
; write its name, e.g.
;     template = Company Report.dotx
; A full path such as C:\Templates\Company Report.dotx works too.
; Never use a finished verification report as the template: it holds
; document content. Make a starter template instead (make_word_template.bat).
template =

; One font for ALL text of the report, e.g. Arial                  (Calibri)
font =

[page]
paper =             ; Letter, A4, Legal, A3, A5 or Tabloid          (Letter)
orientation =       ; portrait or landscape                         (portrait)
margin_top =        ;                                               (0.6 in)
margin_bottom =     ;                                               (0.6 in)
margin_left =       ;                                               (0.7 in)
margin_right =      ;                                               (0.7 in)

; -----------------------------------------------------------------------------
;  THE PARTS OF THE REPORT
;  Each section below is one part of the report. The paragraph parts all
;  accept the same settings (each section lists the most useful ones; any
;  other from this list can be added):
;    word_style         the Word style used for this part, by its name in
;                       Word's Styles pane. Write the name of a style in your
;                       template to use it (e.g. Body Text). Empty = the
;                       report's own style named in (brackets), which is
;                       added to the template if it does not have one.
;    font               font name, e.g. Arial
;    size               font size in points, e.g. 10.5
;    bold, italic       yes or no
;    color              text colour (see the top of this file)
;    alignment          left, center, right or justify
;    space_before       space above the paragraph, in points
;    space_after        space below the paragraph, in points
;    line_spacing       single, 1.15, 1.5, double (a number = times single),
;                       or a fixed line height such as 12 pt, or at least 12 pt
;    indent_left        left indent, e.g. 0.5 cm
;    first_line_indent  e.g. 1 cm; a negative value is a hanging indent
;  The settings change the Word STYLE, so the report can still be restyled
;  in Word afterwards, and every paragraph of that part changes with it.
; -----------------------------------------------------------------------------

[title]
; "Extraction Verification Report" at the top of the first page
;                   (Title: 26 pt, dark blue 17365D, line underneath)
word_style =
size =
color =

[heading 1]
; "Page 12" at the start of each scanned page
;                   (Heading 1: 14 pt bold, blue 365F91, 24 pt before)
word_style =
size =
color =
space_before =

[heading 2]
; "Page 12 - text read by the tool", "How to read this report",
; and the main headings of the scanned document
;                   (Heading 2: 13 pt bold, blue 4F81BD, 10 pt before)
word_style =
size =
color =
space_before =

[heading 3]
; the scanned document's second-level headings
;                   (Heading 3: body size, bold, blue 4F81BD)
word_style =
size =
color =

[heading 4]
; third-level headings and below
;                   (Heading 4: body size, bold italic, blue 4F81BD)
word_style =
size =
color =

[body]
; ordinary paragraphs read from the scan, and the summary at the top
;                   (Normal: Calibri 10 pt, 10 pt after, line spacing 1.15)
word_style =
size =
alignment =
space_before =
space_after =
line_spacing =

[list items]
; list entries read from the scan ("a. ...", "(1) ...")
;                   (List Paragraph: like the body, indented 0.35 in)
word_style =
indent_left =
space_after =

[requirements]
; paragraphs that became a requirement row in the Excel file (they carry an
; [R-0001] tag). List entries keep the list look.
;                   (Requirement Text: like the body)
word_style =
bold =
; where the [R-0001] tag goes: end (after the text) or start (in front of
; it, where a requirement ID usually stands)
tag_position = end
; yes = print the requirement keywords (shall, must, should, will ...) in
; the [requirement keywords] style below
mark_keywords = no

[requirement tag]
; the [R-0001] tags that link the text to its row in the Excel file
;                   (Requirement Tag: 8 pt bold, not italic, blue 1F4E9A)
word_style =
size =
bold =
color =

[requirement keywords]
; shall, must, should, will ... - only used when mark_keywords = yes
;                   (Requirement Keyword: bold)
word_style =
bold =
italic =
color =

[captions]
; table and figure titles, e.g. "TABLE III. Environmental conditions"
;                   (Caption: like the body, italic, centered)
word_style =
size =
bold =
italic =
alignment =

[tables]
; tables read from the scan
word_style =        ; the table style: borders, cell padding  (Table Grid: thin black lines)
alignment =         ; left, center or right    (center; with a template, empty means its table style decides)

[table header row]
; the column headings of each table
;                   (Table Heading: like the table text, bold)
word_style =
; shading of the heading cells, e.g. D9D9D9, or none   (light blue D9E2F3;
; with a template, empty means its table style decides)
fill =
; repeat the heading row at the top of each page a long table runs onto
repeat_on_each_page = yes

[table text]
; the text in table cells, and words read inside figures
;                   (Table Text: 8.5 pt, no space before or after, single)
word_style =
size =
alignment =

[scanned header footer]
; running headers and footers printed on the scanned pages, shown as
; "[header] ..." and "[footer] ..."
;                   (Scanned Header Footer: 8 pt italic, gray 808080)
word_style =
size =
color =

[notes]
; the tool's own remarks: page notes, "[figure]", "This page could not be read"
;                   (Report Note: 8.5 pt italic)
word_style =
size =

[review marks]
; How words that need checking against the scan are marked. These marks are
; the point of the report, so they cannot be switched off.
; Highlighter colours: yellow, bright green, turquoise, pink, blue, red,
; dark blue, teal, green, violet, dark red, dark yellow, gray 25, gray 50, black
check_highlight = yellow         ; words to check against the scan
likely_wrong_highlight = yellow  ; words very likely misread ...
likely_wrong_color = C00000      ; ... are also in this colour, bold (C00000 turns
                                 ; white on a dark highlight)
cell_fill = FFF2CC               ; table cells that hold a word to check
